name: Godot P5 Chromium WebGL2 and IndexedDB v17
# Genuine exported HTML5 test. Lower-gallery state is seeded using an
# engine-valid v17 snapshot; actions, scene transitions and saves run in Godot.
# Web export templates are large: run only when browser workflow changes,
# or explicitly dispatch for release acceptance, not every gameplay commit.
on:
  pull_request:
    paths:
      - ".github/workflows/godot-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

# Heavy Web export templates: never run multiple superseded PR heads together.
concurrency:
  group: godot-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Download matching official Godot 4.7.2 engine and templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fsSL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -fsSL --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q -j /tmp/templates.tpz 'templates/web*' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          rm -f /tmp/templates.tpz /tmp/godot.zip
      - name: Export current PR head to HTML5
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$ENGINE" --headless --path godot --editor --import --quit > /tmp/import.log 2>&1
          mkdir -p godot/build/web
          "$ENGINE" --headless --path godot --export-release "Web" "$(pwd)/godot/build/web/index.html" > /tmp/export.log 2>&1
          for log in /tmp/import.log /tmp/export.log; do
            if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error:|Export failed' "$log"; then exit 1; fi
          done
          test -s godot/build/web/index.html
          test -s godot/build/web/index.wasm
          printf '<!doctype html><meta charset="utf-8"><title>CI-only IDBFS fixture</title>' > godot/build/web/__test_seed__.html
          # __test_seed__.html is untracked and exists solely in the CI artifact directory.
      - name: Install Chromium browser-test tooling
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium --only-shell
      - name: Test fresh v17, physically inspect and warm deep Mesa, IndexedDB reload
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory godot/build/web > /tmp/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node godot/tests/browser_smoke.cjs 2>&1 | tee /tmp/browser-v17.log
          grep -q 'PASS: Chromium WebGL2 fresh v17 + lower v17 archive/heat + real scene return + IndexedDB persistent reload' /tmp/browser-v17.log
          test -s /tmp/nah-depth-cold.png
          test -s /tmp/nah-depth-warm.png
          test -s /tmp/nah-depth-warm-reload.png
          test -s /tmp/nah-mesa-return.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-browser-v17-lighting-and-reload
          path: |
            /tmp/nah-*.png
            /tmp/browser-v17.log
          retention-days: 3
