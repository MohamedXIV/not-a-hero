name: Godot P0 smoke

on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 Standard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import Godot project and parse scripts/scenes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to load resource' /tmp/godot-import.log; then exit 1; fi
      - name: Run game briefly
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --quit-after 90 2>&1 | tee /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to load resource' /tmp/godot-run.log; then exit 1; fi
      - name: Run gameplay state and chunk smoke tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/session_state_smoke.gd
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/world_chunk_smoke.tscn --quit-after 180
