name: Godot P0 smoke

on:
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.7.2 Standard
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import Godot project and parse scripts/scenes
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to load resource' /tmp/godot-import.log; then exit 1; fi
      - name: Run game briefly
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --quit-after 90 2>&1 | tee /tmp/godot-run.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed to load resource' /tmp/godot-run.log; then exit 1; fi
      - name: Run gameplay state and chunk smoke tests
        shell: bash
        run: |
          set -euo pipefail
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/inventory_smoke.gd 2>&1 | tee /tmp/inventory-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/loot_smoke.gd 2>&1 | tee /tmp/loot-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/condition_smoke.gd 2>&1 | tee /tmp/condition-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/yuna_voice_smoke.gd 2>&1 | tee /tmp/voice-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/decor_smoke.gd 2>&1 | tee /tmp/decor-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/home_production_smoke.gd 2>&1 | tee /tmp/home-production-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/session_state_smoke.gd 2>&1 | tee /tmp/session-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/world_chunk_smoke.tscn --quit-after 180 2>&1 | tee /tmp/chunk-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/movement_smoke.tscn --quit-after 180 2>&1 | tee /tmp/movement-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/combat_smoke.tscn --quit-after 1200 2>&1 | tee /tmp/combat-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/storage_smoke.tscn --quit-after 180 2>&1 | tee /tmp/storage-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/condition_scene_smoke.tscn --quit-after 180 2>&1 | tee /tmp/condition-scene-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/home_care_smoke.tscn --quit-after 180 2>&1 | tee /tmp/home-care-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/yuna_voice_scene_smoke.tscn --quit-after 180 2>&1 | tee /tmp/voice-scene-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/decor_scene_smoke.tscn --quit-after 180 2>&1 | tee /tmp/decor-scene-test.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot res://tests/home_life_smoke.tscn --quit-after 180 2>&1 | tee /tmp/home-life-test.log
          for logfile in /tmp/home-production-test.log /tmp/home-life-test.log /tmp/decor-test.log /tmp/decor-scene-test.log /tmp/voice-test.log /tmp/voice-scene-test.log /tmp/home-care-test.log /tmp/condition-test.log /tmp/condition-scene-test.log /tmp/inventory-test.log /tmp/loot-test.log /tmp/session-test.log /tmp/chunk-test.log /tmp/movement-test.log /tmp/combat-test.log /tmp/storage-test.log; do
            if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load' "$logfile"; then
              echo "Godot reported an engine/script error in $logfile"
              exit 1
            fi
            if ! grep -q '^PASS:' "$logfile"; then
              echo "Expected PASS marker missing from $logfile"
              exit 1
            fi
          done

      - name: Capture Compatibility renderer preview frames
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --audio-driver Dummy --path godot res://tests/render_smoke.tscn --quit-after 180 2>&1 | tee /tmp/godot-render.log
          if grep -E 'ERROR:|SCRIPT ERROR:|Parse Error:|Failed to load|Visual smoke failure' /tmp/godot-render.log; then exit 1; fi
          grep -q '^PASS:' /tmp/godot-render.log
          test -s godot/build/screenshots/starter_shelter.png
          test -s godot/build/screenshots/outdoors_dusk.png
          file godot/build/screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: godot-p0-lighting-previews
          path: godot/build/screenshots/*.png
          retention-days: 3
